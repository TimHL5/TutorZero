<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001833"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#004D99"/>
    </linearGradient>
    <linearGradient id="bArcI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="30%" stop-color="#006BB6"/>
      <stop offset="100%" stop-color="#4DA8DA"/>
    </linearGradient>
    <linearGradient id="gArcI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A651"/>
      <stop offset="100%" stop-color="#7BC67E"/>
    </linearGradient>
    <radialGradient id="spkI" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#F47920"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgG)"/>

  <!-- Blue arc (290°) -->
  <path d="M 370.68 336.3 A 140 140 0 1 1 370.68 175.7"
    stroke="url(#bArcI)" stroke-width="36" fill="none" stroke-linecap="round"/>
  <!-- Green arc (70°) -->
  <path d="M 370.68 175.7 A 140 140 0 0 1 370.68 336.3"
    stroke="url(#gArcI)" stroke-width="36" fill="none" stroke-linecap="round"/>

  <!-- Convergence dots -->
  <circle cx="370.68" cy="175.7" r="16" fill="#004D99"/>
  <circle cx="370.68" cy="175.7" r="9.6" fill="#4DA8DA"/>
  <circle cx="370.68" cy="336.3" r="16" fill="#004D99"/>
  <circle cx="370.68" cy="336.3" r="9.6" fill="#4DA8DA"/>

  <!-- Center spark -->
  <circle cx="256" cy="256" r="26" fill="url(#spkI)"/>
</svg>